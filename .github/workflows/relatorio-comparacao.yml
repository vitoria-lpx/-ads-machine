name: Relatório de Comparação de Criativos

on:
  schedule:
    # 08:00 em São Paulo (UTC-3, sem horário de verão) = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Restaurar token do Google Drive
        run: echo "$GOOGLE_TOKEN_JSON" > scripts/.google-token.json
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Gerar relatório
        run: npm run relatorio-comparacao
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Upload do PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-comparacao-${{ github.run_id }}
          path: relatorios/*.pdf
          retention-days: 30
          if-no-files-found: error
